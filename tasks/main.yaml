---
- name: Check if Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_check
  ignore_errors: true

- name: Install Docker if not present
  block:
    - name: Install prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - systemd-container
        update_cache: yes

    - name: Add Docker’s official GPG key
      become: true
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      become: true
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      become: true
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes
      notify: Restart docker

    - name: Ensure docker group exists
      become: true
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add user to docker group
      become: true
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes
      when: docker_install_mode != 'rootless'

    - name: Install rootless dependencies
      become: true
      ansible.builtin.apt:
        name:
          - uidmap
          - dbus-user-session
        state: present
      when: docker_install_mode == 'rootless'

    - name: Stop and disable docker.service (systemd, rootless mode)
      become: true
      ansible.builtin.systemd:
        name: docker
        enabled: false
        state: stopped
      when: docker_install_mode != 'rootless'


    - name: Enable machinectl user access for rootless Docker
      become: true
      ansible.builtin.command: "machinectl shell {{ docker_user }}@ /usr/bin/dockerd-rootless-setuptool.sh install"
      when: docker_install_mode == 'rootless'

    - name: Enable rootless Docker
      become: true
      ansible.builtin.command: "machinectl shell {{ docker_user }}@ /usr/bin/systemctl --user enable --now docker"
      when: docker_install_mode == 'rootless'


    - name: Enable linger for rootless user (systemd user units allowed after logout)
      become: true
      ansible.builtin.command: "loginctl enable-linger {{ docker_user }}"
      when: docker_install_mode == 'rootless'

    - name: Enable and start docker.service (systemd, normal mode)
      become: true
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      when: docker_install_mode != 'rootless'


- name: Print Docker info
  ansible.builtin.command: docker info
  register: docker_info
  when: docker_install_mode != 'rootless'

- name: Print rootless Docker info
  become: true
  ansible.builtin.command: "machinectl shell {{ docker_user }}@ /usr/bin/docker info"
  register: docker_info
  when: docker_install_mode == 'rootless'
  ignore_errors: true


- name: Show Docker info
  ansible.builtin.debug:
    var: docker_info.stdout
