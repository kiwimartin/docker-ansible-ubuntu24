---
- name: Build proxy environment for Docker installation
  ansible.builtin.set_fact:
    _docker_install_proxy_environment: >-
      {{
        {}
        | combine(
            {
              'HTTP_PROXY': docker_proxy.http_proxy,
              'http_proxy': docker_proxy.http_proxy
            }
            if docker_proxy.http_proxy | default('') | string | length > 0
            else {}
          )
        | combine(
            {
              'HTTPS_PROXY': docker_proxy.https_proxy,
              'https_proxy': docker_proxy.https_proxy
            }
            if docker_proxy.https_proxy | default('') | string | length > 0
            else {}
          )
        | combine(
            {
              'NO_PROXY': docker_proxy.no_proxy,
              'no_proxy': docker_proxy.no_proxy
            }
            if docker_proxy.no_proxy | default('') | string | length > 0
            else {}
          )
      }}

- name: Configure Docker APT repository
  block:
    - name: Remove conflicting deb822 Docker repository
      become: true
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.sources
        state: absent

    - name: Ensure APT keyring directory exists
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Docker repository signing key
      become: true
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
        force: true

    - name: Configure canonical Docker repository
      become: true
      ansible.builtin.copy:
        content: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        dest: /etc/apt/sources.list.d/docker.list
        owner: root
        group: root
        mode: "0644"
  environment: "{{ _docker_install_proxy_environment }}"

- name: Check if Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_check
  ignore_errors: true

- name: Install Docker if not present
  block:
    - name: Install prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - systemd-container
          - uidmap
        update_cache: yes

    - name: Install Docker Engine
      become: true
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes
      notify: Restart docker

    - name: Ensure docker group exists
      become: true
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add user to docker group
      become: true
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes
      when: docker_install_mode != 'rootless'

    - name: Install rootless dependencies
      become: true
      ansible.builtin.apt:
        name:
          - uidmap
          - dbus-user-session
        state: present
      when: docker_install_mode == 'rootless'

    - name: Stop and disable docker.service (systemd, rootless mode)
      become: true
      ansible.builtin.systemd:
        name: docker
        enabled: false
        state: stopped
      when: docker_install_mode != 'rootless'


    - name: Enable machinectl user access for rootless Docker
      become: true
      ansible.builtin.command: "machinectl shell {{ docker_user }}@ /usr/bin/dockerd-rootless-setuptool.sh install"
      when: docker_install_mode == 'rootless'

    - name: Enable rootless Docker
      become: true
      ansible.builtin.command: "machinectl shell {{ docker_user }}@ /usr/bin/systemctl --user enable --now docker"
      when: docker_install_mode == 'rootless'


    - name: Enable linger for rootless user (systemd user units allowed after logout)
      become: true
      ansible.builtin.command: "loginctl enable-linger {{ docker_user }}"
      when: docker_install_mode == 'rootless'

    - name: Enable and start docker.service (systemd, normal mode)
      become: true
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      when: docker_install_mode != 'rootless'
  environment: "{{ _docker_install_proxy_environment }}"

- name: Configure Docker daemon proxy
  ansible.builtin.include_tasks: proxy.yaml


- name: Print Docker info
  ansible.builtin.command: docker info
  register: docker_info
  become: true
  when: docker_install_mode != 'rootless'

- name: Print rootless Docker info
  become: true
  ansible.builtin.command: "machinectl shell {{ docker_user }}@ /usr/bin/docker info"
  register: docker_info
  when: docker_install_mode == 'rootless'
  ignore_errors: true


- name: Show Docker info
  ansible.builtin.debug:
    var: docker_info.stdout
